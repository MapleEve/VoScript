name: Build and publish Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable published tag (run the workflow from main)."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-image-publication
  cancel-in-progress: false

env:
  RUST_KERNEL_MODE: required

jobs:
  validate-source:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      control-sha: ${{ steps.source.outputs.control-sha }}
    steps:
      - name: Checkout immutable trusted main validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, node24
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0, node24
        with:
          python-version: "3.11"
      - name: Validate tag as data using only the trusted main helper
        id: source
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
        run: python voscript-api/scripts/ci_release_contracts.py release
      - name: Checkout already validated source for read-only scanning
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, node24
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Scan candidate with trusted main scanner, never candidate code
        run: python control/voscript-api/scripts/public_release_scan.py --root candidate

  publish:
    needs: validate-source
    defaults:
      run:
        working-directory: source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
      packages: write
    steps:
      - name: Checkout immutable trusted control tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, node24
        with:
          ref: ${{ needs.validate-source.outputs.control-sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout validated exact release SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, node24
        with:
          ref: ${{ needs.validate-source.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0, node24
        with:
          python-version: "3.11"
      - name: Install build and image audit tools
        run: |
          rustup toolchain install stable --profile minimal
          python -m pip install "maturin>=1.13,<2" pip-audit
          cargo install cargo-audit --locked
          cargo audit --file Cargo.lock --deny warnings
      - name: Build Rust wheel
        run: python -m maturin build --release --manifest-path crates/voscript_core/Cargo.toml --locked --features extension-module --out dist
      - name: Stage the exact release wheel
        id: wheel
        run: |
          set -euo pipefail
          mkdir -p app/.wheelhouse
          wheel_count="$(find dist -maxdepth 1 -name 'voscript_core-*.whl' | wc -l | tr -d ' ')"
          test "$wheel_count" = "1"
          wheel_path="$(find dist -maxdepth 1 -name 'voscript_core-*.whl' -print -quit)"
          cp "$wheel_path" app/.wheelhouse/
          echo "name=$(basename "$wheel_path")" >> "$GITHUB_OUTPUT"
      - name: Build once and record the immutable local image ID
        id: image
        env:
          SOURCE_SHA: ${{ needs.validate-source.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate-source.outputs.tag }}
          WHEEL: ${{ steps.wheel.outputs.name }}
        run: |
          set -euo pipefail
          docker build ./app \
            --build-arg "VOSCRIPT_CORE_WHEEL=$WHEEL" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --iidfile "$RUNNER_TEMP/release-image-id" \
            -t "voscript-release:$SOURCE_SHA"
          echo "id=$(cat "$RUNNER_TEMP/release-image-id")" >> "$GITHUB_OUTPUT"
      - name: Audit installed base/out-of-requirements dependencies and smoke the publish image
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: python ../control/voscript-api/scripts/image_release_gate.py "$IMAGE_ID" --source-root .
      - name: Preserve strict installed-image audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, node24
        with:
          name: release-image-audit-${{ needs.validate-source.outputs.sha }}
          path: ${{ runner.temp }}/voscript-image-audit
          if-no-files-found: warn
      - name: Revalidate source evidence immediately before registry writes
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ needs.validate-source.outputs.sha }}
        run: python voscript-api/scripts/ci_release_contracts.py release
      - name: Authenticate existing registries
        env:
          GHCR_PASSWORD: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_PASSWORD" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Push only the audited/smoked image, never rebuild
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
          SOURCE_SHA: ${{ needs.validate-source.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate-source.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GHCR_IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          DOCKERHUB_IMAGE="mapleeve/voscript"
          tags=("$GHCR_IMAGE:$RELEASE_TAG" "$DOCKERHUB_IMAGE:${RELEASE_TAG#v}"
                "$GHCR_IMAGE:sha-$SOURCE_SHA" "$DOCKERHUB_IMAGE:sha-$SOURCE_SHA")
          # Older published releases must not roll latest back.
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$latest_tag" = "$RELEASE_TAG" ]; then
            tags+=("$GHCR_IMAGE:latest" "$DOCKERHUB_IMAGE:latest")
          fi
          for tag in "${tags[@]}"; do
            docker tag "$IMAGE_ID" "$tag"
            test "$(docker image inspect "$tag" --format '{{.Id}}')" = "$IMAGE_ID"
            docker push "$tag"
          done
