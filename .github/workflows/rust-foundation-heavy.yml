name: Rust Foundation Heavy Gate

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact target SHA; main may test any target, candidate branches only their own HEAD."
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  RUST_KERNEL_MODE: required

jobs:
  resolve-source:
    name: resolve-source
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, node24
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.workflow_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind all heavy evidence to the immutable target
        id: source
        env:
          REQUESTED_SHA: ${{ github.event_name != 'workflow_dispatch' && (github.event.pull_request.head.sha || github.sha) || inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/rust-foundation-heavy.yml@$GITHUB_REF"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              git cat-file -e "$REQUESTED_SHA^{commit}" || git fetch --no-tags origin "$REQUESTED_SHA"
              python voscript-api/scripts/ci_release_contracts.py write-proof
            else
              # Candidate dispatches validate only themselves via native Actions checks.
              [[ "$GITHUB_REF" == refs/heads/* ]]
              test "$REQUESTED_SHA" = "$GITHUB_SHA"
            fi
          else
            test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          fi
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Upload immutable trusted target proof
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        id: proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, node24
        with:
          name: heavy-target-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heavy-target-proof/proof.json
          overwrite: false
          if-no-files-found: error
          retention-days: 14
      - name: Anchor proof identity in the trusted resolver job log
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        env:
          ARTIFACT_ID: ${{ steps.proof.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.proof.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          printf 'HEAVY_PROOF_ANCHOR={"artifact_id":%s,"artifact_digest":"sha256:%s"}\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST"

  rust-wheel:
    name: rust-wheel
    runs-on: ubuntu-latest
    needs: resolve-source
    outputs:
      wheel-name: ${{ steps.wheel.outputs.name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, node24
        with:
          ref: ${{ needs.resolve-source.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0, node24
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install maturin
        run: python -m pip install "maturin>=1.13,<2"
      - name: Check Rust formatting
        run: cargo fmt --manifest-path crates/voscript_core/Cargo.toml -- --check
      - name: Run Rust clippy
        run: cargo clippy --manifest-path crates/voscript_core/Cargo.toml --locked --features python-bindings --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --manifest-path crates/voscript_core/Cargo.toml --locked
      - name: Audit Rust advisories
        run: |
          cargo install cargo-audit --locked
          cargo audit --file Cargo.lock --deny warnings
      - name: Build Rust wheel
        run: python -m maturin build --release --manifest-path crates/voscript_core/Cargo.toml --locked --features extension-module --out dist
      - name: Verify wheel artifact
        id: wheel
        run: |
          set -euo pipefail
          wheel_count="$(find dist -maxdepth 1 -name 'voscript_core-*.whl' | wc -l | tr -d ' ')"
          test "$wheel_count" = "1"
          wheel_path="$(find dist -maxdepth 1 -name 'voscript_core-*.whl' -print -quit)"
          echo "name=$(basename "$wheel_path")" >> "$GITHUB_OUTPUT"
      - name: Upload target-SHA wheel artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, node24
        with:
          name: voscript-core-wheel-${{ needs.resolve-source.outputs.source-sha }}
          path: dist/voscript_core-*.whl
          if-no-files-found: error
          retention-days: 1

  docker-packaging:
    name: docker-packaging
    runs-on: ubuntu-latest
    needs: [resolve-source, rust-wheel]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, node24
        with:
          ref: ${{ needs.resolve-source.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0, node24
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0, node24
        with:
          name: voscript-core-wheel-${{ needs.resolve-source.outputs.source-sha }}
          path: app/.wheelhouse
      - name: Verify downloaded wheel
        env:
          WHEEL: ${{ needs.rust-wheel.outputs.wheel-name }}
        run: test -f "app/.wheelhouse/$WHEEL"
      - name: Build Docker image with Rust extension
        env:
          WHEEL: ${{ needs.rust-wheel.outputs.wheel-name }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source-sha }}
        run: |
          docker build ./app \
            --build-arg "VOSCRIPT_CORE_WHEEL=$WHEEL" \
            -t "voscript-rust-foundation:$SOURCE_SHA"
      - name: Audit installed image and run fail-closed smoke
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source-sha }}
        run: |
          python -m pip install pip-audit
          RUST_KERNEL_MODE=required python voscript-api/scripts/image_release_gate.py "voscript-rust-foundation:$SOURCE_SHA"
      - name: Preserve strict installed-image audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, node24
        with:
          name: heavy-image-audit-${{ needs.resolve-source.outputs.source-sha }}
          path: ${{ runner.temp }}/voscript-image-audit
          if-no-files-found: warn

  report-candidate-statuses:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [resolve-source, rust-wheel, docker-packaging]
    permissions:
      statuses: write
    steps:
      - name: Mirror candidate heavy job results on the same workflow SHA
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0, node24
        env:
          TARGET_SHA: ${{ inputs.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RESULTS: ${{ toJSON(needs) }}
        with:
          github-token: ${{ github.token }}
          script: |
            const sha = process.env.TARGET_SHA;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const workflowRef = `${repository}/.github/workflows/rust-foundation-heavy.yml@${context.ref}`;
            if (
              context.eventName !== "workflow_dispatch" ||
              !context.ref.startsWith("refs/heads/") || context.ref === "refs/heads/main" ||
              context.payload.repository?.full_name !== repository ||
              process.env.GITHUB_WORKFLOW_REF !== workflowRef ||
              !/^[0-9a-f]{40}$/.test(sha) ||
              sha !== context.sha || sha !== process.env.GITHUB_WORKFLOW_SHA
            ) throw new Error("Candidate statuses require the same repository, branch and workflow SHA");
            const results = JSON.parse(process.env.RESULTS);
            if (
              results["resolve-source"]?.result === "success" &&
              results["resolve-source"].outputs?.["source-sha"] !== sha
            ) throw new Error("Resolver target SHA mismatch");
            const attempt = process.env.RUN_ATTEMPT;
            if (!/^[1-9][0-9]*$/.test(attempt)) throw new Error("Invalid run attempt");
            const runUrl = `${context.serverUrl}/${repository}/actions/runs/${context.runId}/attempts/${attempt}`;
            let failed = false;
            for (const name of ["resolve-source", "rust-wheel", "docker-packaging"]) {
              const result = results[name]?.result ?? "missing";
              const success = result === "success";
              failed ||= !success;
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha, context: name,
                state: success ? "success" : "failure",
                target_url: runUrl,
                description: `Heavy ${name}: ${result} (attempt ${attempt})`,
              });
            }
            if (failed) core.setFailed("One or more candidate heavy jobs did not succeed");

  report-target-checks:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.resolve-source.outputs.source-sha != '' }}
    runs-on: ubuntu-latest
    needs: [resolve-source, rust-wheel, docker-packaging]
    permissions:
      contents: read
      checks: write
    steps:
      - name: Publish manual heavy evidence on the tested SHA, not the selected workflow ref
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0, node24
        env:
          TARGET_SHA: ${{ needs.resolve-source.outputs.source-sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const sha = process.env.TARGET_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error("Invalid target SHA");
            const results = JSON.parse(process.env.RESULTS);
            let failed = false;
            for (const name of ["resolve-source", "rust-wheel", "docker-packaging"]) {
              const success = results[name].result === "success";
              failed ||= !success;
              await github.rest.checks.create({
                ...context.repo, name, head_sha: sha, status: "completed",
                conclusion: success ? "success" : "failure",
                external_id: `heavy:${context.runId}:${process.env.RUN_ATTEMPT}:${sha}`,
                details_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                output: {title: name, summary: `Target SHA: ${sha}; result: ${results[name].result}`},
              });
            }
            if (failed) core.setFailed("One or more exact-SHA heavy checks failed");
