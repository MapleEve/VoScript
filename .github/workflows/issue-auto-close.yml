name: Issue Close Automation

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  maintain-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Maintain inactive issues using the existing repository token
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0, node24
        with:
          script: |
            const now = Date.now();
            const day = 24 * 60 * 60 * 1000;
            const closingLabels = new Map([
              ["✅ Fixed", 7], ["🤔 Need Reproduce", 7], ["🙅🏻‍♀️ WON'T DO", 3],
            ]);
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "open", per_page: 100,
            });
            for (const issue of issues) {
              if (issue.pull_request) continue;
              // Refresh before mutating, so recent activity is not closed from a stale list.
              const {data: current} = await github.rest.issues.get({
                ...context.repo, issue_number: issue.number,
              });
              if (current.state !== "open") continue;
              const age = (now - Date.parse(current.updated_at)) / day;
              const labels = current.labels.map(label => typeof label === "string" ? label : label.name);
              const closing = [...closingLabels].find(([label, days]) => labels.includes(label) && age >= days);
              if (closing) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: current.number,
                  body: `Closing after ${closing[1]} days without activity under the "${closing[0]}" label. Please comment if further investigation is needed.`,
                });
                await github.rest.issues.update({
                  ...context.repo, issue_number: current.number, state: "closed",
                });
              } else if (age >= 60 && !labels.includes("Inactive")) {
                await github.rest.issues.addLabels({
                  ...context.repo, issue_number: current.number, labels: ["Inactive"],
                });
              }
            }
